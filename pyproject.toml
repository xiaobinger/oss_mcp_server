[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-mcp-server"
version = "0.1.0"
description = "Aliyun OSS MCP server for uploading, downloading, replacing and managing objects"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.29.0,<2.0.0",
    "oss2>=2.19.1,<3.0.0",
    "requests>=2.34.2,<3.0.0",
    "uvicorn>=0.31.1,<1.0.0",
]
keywords = ["mcp", "model-context-protocol", "aliyun", "oss", "object-storage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/xiaobinger/oss_mcp_server"
Repository = "https://github.com/xiaobinger/oss_mcp_server"
Issues = "https://github.com/xiaobinger/oss_mcp_server/issues"

[project.scripts]
oss-mcp-server = "oss_mcp_server:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["http_auth", "oss_mcp_server", "oss_utils"]
